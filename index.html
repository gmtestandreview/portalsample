<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMI Services Portal</title>

    <!--
    PWA / OS chrome colour. Canonical app identity is NMI Blue (#285576);
    NMI Brand Red (#7B0B15) is an in-app accent only, not the chrome colour.
    Keep these in sync with $nmi-primary in ClientApp/src/styles/_variables.scss.
  -->
    <meta name="theme-color" content="#285576" />
    <meta name="msapplication-TileColor" content="#285576" />
    <meta name="msapplication-TileImage" content="/NMI-tile.png" />
    <meta property="og:image" content="/NMI-tile.png" />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
      type="image/vnd.microsoft.icon"
    />
    <link rel="apple-touch-icon" href="/NMI-tile.png" />

    <!-- Vite replaces this build-time signal through envTemplatePlugin. -->
    <meta name="nmi-environment" content="<%= VITE_ENVIRONMENT %>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/ClientApp/src/index.tsx"></script>
  </body>
</html>
