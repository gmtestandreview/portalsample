# SonarQube Cloud (EU) project binding.
# Consumed by sonar-scanner for analysis, and auto-discovered by `sonar run mcp`
# so project-scoped MCP tools (issues, quality gate, coverage) resolve.

sonar.projectKey=gmtestandreview_portalsample
sonar.organization=gmtestandreview
sonar.host.url=https://sonarcloud.io

# --- Scope -------------------------------------------------------------------
sonar.sources=ClientApp/src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Generated / vendor code. Mirrors the "Never edit" list in CLAUDE.md — findings
# here are unactionable because the files are regenerated or third-party.
sonar.exclusions=\
  ClientApp/src/api/web-api-client.ts,\
  ClientApp/src/main.*.js,\
  ClientApp/src/external/**,\
  ClientApp/webpack/**,\
  ClientApp/source-map-http-downloads/**,\
  **/*.stories.tsx,\
  **/*.d.ts

# --- Coverage ----------------------------------------------------------------
# NOTE: not yet produced. vitest.unit.config.ts uses
# reporter: ['text','html','json-summary','json'] with reportsDirectory
# './reports/coverage/unit' — 'lcov' must be added to that list for this path to
# exist. The coverageConfig.test.ts guard asserts the reporter array, so update
# the guard in the same change. Until then SonarCloud reports 0% coverage.
sonar.javascript.lcov.reportPaths=reports/coverage/unit/lcov.info
