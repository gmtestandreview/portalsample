# SonarQube Cloud (EU) project binding.
# Consumed by sonar-scanner for analysis, and auto-discovered by `sonar run mcp`
# so project-scoped MCP tools (issues, quality gate, coverage) resolve.

sonar.projectKey=gmtestandreview_portalsample
sonar.organization=gmtestandreview

# Mirrors the version in package.json. Two reasons to declare it:
# 1. Analyses are labelled, so you can tell which build a finding came from.
# 2. It enables the 'Previous version' New Code definition, where the
#    baseline moves only when this value is bumped - unlike a day count,
#    which silently drops ageing debt out of the quality gate over time.
# Keep it in step with package.json, or override per-run with
#   sonar-scanner -Dsonar.projectVersion=$(node -p "require('./package.json').version")
sonar.projectVersion=0.1.0

# --- Scope -------------------------------------------------------------------
# webpack.config.js is included in Vitest's coverage `include`, so it appears
# in lcov.info. Listing it here keeps the scanner from warning about an
# unresolvable coverage path, and means the two tools measure the same set.
sonar.sources=ClientApp/src,webpack.config.js
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Without this the scanner walks the whole tree collecting TSConfig files -
# 227 of them here, nearly all inside node_modules. Pinning the root config
# skips that traversal. Must stay consistent with sonar.sources.
sonar.typescript.tsconfigPaths=tsconfig.json

# Generated / vendor code. Mirrors the "Never edit" list in CLAUDE.md — findings
# here are unactionable because the files are regenerated or third-party.
sonar.exclusions=\
  ClientApp/src/api/web-api-client.ts,\
  ClientApp/src/main.*.js,\
  ClientApp/src/external/**,\
  ClientApp/src/parent/**,\
  ClientApp/webpack/**,\
  ClientApp/source-map-http-downloads/**,\
  **/*.stories.tsx,\
  **/*.d.ts


# Coverage carve-outs. Mirrors the `exclude` list in vitest.unit.config.ts so
# SonarCloud and lcov measure the same denominator; guarded by
# tests/unit/config/sonarCoverageContract.test.ts, which fails if the two drift.
# Brace alternation is expanded because Sonar path matchers are Ant-style and
# have no `{ts,tsx}` equivalent.
#
# Deliberately NOT folded into sonar.exclusions above: that property drops files
# from analysis entirely, so every bug, smell and security rule would stop
# running on them. A coverage carve-out must not shrink the defect surface.
sonar.coverage.exclusions=\
  **/*.d.ts,\
  ClientApp/src/api/web-api-client.ts,\
  ClientApp/src/external/**,\
  ClientApp/src/parent/**,\
  ClientApp/src/storybook/**,\
  ClientApp/src/components/App/**,\
