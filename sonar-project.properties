  ClientApp/src/components/reactaria_components/**,\
  ClientApp/source-map-http-downloads/**,\
  ClientApp/src/**/*.test.ts,\
  ClientApp/src/**/*.test.tsx,\
  ClientApp/src/**/*.spec.ts,\
  ClientApp/src/**/*.spec.tsx,\
  ClientApp/src/**/*.stories.ts,\
  ClientApp/src/**/*.stories.tsx,\
