name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    name: claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # github_token authenticates the action's built-in GitHub MCP tools with
      # this repo's GH_PERSONAL_ACCESS_TOKEN PAT instead of the default
      # GITHUB_TOKEN. GitHub does not trigger downstream workflows (pr.yml,
      # chromatic.yml) on commits pushed with GITHUB_TOKEN, so a PAT is what
      # lets Claude's commits flow through the normal PR gate.
      - uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
