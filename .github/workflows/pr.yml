name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the in-flight run for that PR obsolete. Cancel it
# rather than paying for both sets of jobs - matches chromatic.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'
  # Every job provisions npm through `corepack enable`, which resolves the version
  # from package.json's packageManager field instead of npx-installing a pinned
  # copy at CI time (npx also runs the fetched package's lifecycle scripts). In
  # CI corepack must never block on its "download this package manager?" prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# GitHub's implicit runner shell is `bash -e`, which has no pipefail: a step
# that pipes into `tee` would report the exit code of `tee`, not of the command
# being recorded. Naming bash explicitly restores `-o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  # Path gate for the narrowly-scoped checks below. A whole-workflow `paths:`
  # filter would gate every job; this classifies the PR's changed files once and
  # lets quality-node24 / lower-bound-node24 opt in.
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      agent-tooling: ${{ steps.scope.outputs.agent-tooling }}
      date-logic: ${{ steps.scope.outputs.date-logic }}
      deps: ${{ steps.scope.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          match() { grep -qE "$1" <<< "$CHANGED"; }

          # Agent-orchestration tooling, disjoint from the React app.
          if match '^(scripts|templates|tests/hooks)/'; then
            echo "agent-tooling=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent-tooling=false" >> "$GITHUB_OUTPUT"
            echo "No scripts/, templates/, or tests/hooks/ changes - agent-tooling steps will be skipped."
          fi

          # dateOnly.ts local-vs-UTC split and its consumers / tests.
          if match '^(ClientApp/src/utils/dateOnly\.ts|ClientApp/src/components/Inputs/DatePicker/|ClientApp/src/routes/requestForQuote/|tests/unit/utils/dateOnly\.test\.ts|tests/unit/components/inputs/datePickerWrapper\.test\.tsx|tests/unit/routes/requestForQuote/)'; then
            echo "date-logic=true" >> "$GITHUB_OUTPUT"
          else
            echo "date-logic=false" >> "$GITHUB_OUTPUT"
            echo "No dateOnly / DatePicker / requestForQuote changes - Sydney date steps will be skipped."
          fi

          # The dependency tree and the CI install path. lower-bound-node24 only
          # re-proves the floor when one of these moves.
          if match '^(package\.json|package-lock\.json|\.node-version|\.npmrc|\.github/)'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
            echo "No dependency or workflow changes - lower-bound-node24 will be skipped."
          fi

  quality-node24:
    name: quality-node24
    needs: detect-changes
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Prepare evidence directories
        run: mkdir -p reports/ci/quality reports/ci/agent-tooling

      - name: Install dependencies with declared npm
        id: install
        run: npm ci 2>&1 | tee reports/ci/quality/install.log

      - name:
          Verify optional native bindings installed (npm/cli#4828 workaround)
        id: binding
        uses: ./.github/actions/verify-rolldown-binding

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run type-check 2>&1 | tee reports/ci/quality/type-check.log

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run lint 2>&1 | tee reports/ci/quality/lint.log

      - name: Lint MDX
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run lint:mdx 2>&1 | tee reports/ci/quality/lint-mdx.log

      # Guards analysis/BUSINESS_RULES.md against citation rot. A 2026-09-02 audit (CRD-044) found
      # 18 of 21 examined citations pointing at the wrong line, three past end of file, because line
      # numbers decay on every edit above them. Fails only on citations that are provably wrong or
      # unreachable; weakly-anchored ones are reported without failing the build.
      - name: Verify business rule citations
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run lint:rules 2>&1 | tee reports/ci/quality/lint-rules.log

      - name: Run quality tests
        id: quality_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run test:ci:quality

      - name: Build app
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run: npm run build 2>&1 | tee reports/ci/quality/app-build.log

      - name: Verify Storybook documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' }}
        run:
          npm run storybook:verify:docs 2>&1 | tee
          reports/ci/quality/storybook-build.log

      # The agent-orchestration tooling under scripts/, templates/, and
      # tests/hooks/ gates real behaviour - a PreToolUse security hook and a
      # watcher that shells out and writes files - but is disjoint from the React
      # app. It now runs as scoped quality evidence instead of creating an
      # always-skipped PR status.
      # tests/hooks imports pytest; the runner's system Python does not ship
      # it. --break-system-packages is safe here: the runner is ephemeral.
      - name: Install Python test dependencies
        if: ${{ !cancelled() && needs.detect-changes.outputs.agent-tooling == 'true' }}
        run:
          python3 -m pip install --disable-pip-version-check
          --break-system-packages pytest==9.1.1

      - name: Python tooling syntax
        if: ${{ !cancelled() && needs.detect-changes.outputs.agent-tooling == 'true' }}
        run:
          python3 -m compileall -q scripts templates tests/hooks 2>&1 | tee
          reports/ci/agent-tooling/python-compile.log

      - name: Hook guard behaviour
        if: ${{ !cancelled() && needs.detect-changes.outputs.agent-tooling == 'true' }}
        run:
          python3 tests/hooks/test_pre_tool_use.py 2>&1 | tee
          reports/ci/agent-tooling/hook-guard.log

      - name: Watcher pid handling
        if: ${{ !cancelled() && needs.detect-changes.outputs.agent-tooling == 'true' }}
        run:
          python3 tests/hooks/test_watcher_pid.py 2>&1 | tee
          reports/ci/agent-tooling/watcher-pid.log

      # Regression cover for the deliberate local-vs-UTC split in dateOnly.ts:
      # vitest-unit exercises these files in the runner's default zone; this
      # scoped step re-runs them under Australia/Sydney, the NMI user base and
      # the "east of UTC, date already rolled over" edge.
      - name: Run focused date suite under Australia/Sydney
        id: date_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.binding.outcome == 'success' && needs.detect-changes.outputs.date-logic == 'true' }}
        env:
          TZ: Australia/Sydney
        run: >-
          npm run test:unit --
          tests/unit/components/inputs/datePickerWrapper.test.tsx
          tests/unit/routes/requestForQuote/props.test.ts
          tests/unit/routes/requestForQuote/validation.test.ts
          tests/unit/utils/dateOnly.test.ts --reporter=default --reporter=junit
          --outputFile.junit=reports/vitest/date-sydney-junit.xml

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-node24-${{ github.run_attempt }}
          path: reports/ci/quality/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload quality JUnit report
        if: always() && steps.quality_tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-quality-${{ github.run_attempt }}
          path: reports/vitest/quality-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload agent-tooling logs
        if: always() && needs.detect-changes.outputs.agent-tooling == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-tooling-${{ github.run_attempt }}
          path: reports/ci/agent-tooling/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Australia/Sydney JUnit report
        if: always() && steps.date_tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: date-sydney-${{ github.run_attempt }}
          path: reports/vitest/date-sydney-junit.xml
          if-no-files-found: error
          retention-days: 14

  # Each long-running test environment remains its own required status. Keeping
  # unit, Storybook Browser Mode, and Playwright separate preserves attribution
  # and avoids serializing the slowest parts of the PR gate.
  vitest:
    name: vitest-${{ matrix.partition.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition:
          - name: unit
            command: npm run test:ci:unit
            report: reports/vitest/unit-junit.xml
            install-browser: false
          - name: storybook
            command: npm run test:ci:storybook
            report: reports/vitest/storybook-junit.xml
            install-browser: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Install dependencies with declared npm
        run: npm ci

      - name:
          Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # A fresh runner has no browser binaries; dependency install does not
      # provision them (proved by commit cb5fdaa).
      - name: Install Playwright Chromium
        if: matrix.partition.install-browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run ${{ matrix.partition.name }} tests
        run: ${{ matrix.partition.command }}

      - name: Upload ${{ matrix.partition.name }} JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-${{ matrix.partition.name }}-${{ github.run_attempt }}
          path: ${{ matrix.partition.report }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage
        if: always() && matrix.partition.name == 'unit'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-unit-coverage-${{ github.run_attempt }}
          path: reports/coverage/unit/**
          if-no-files-found: error
          retention-days: 14

  e2e-node24:
    name: e2e-node24
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Install dependencies with declared npm
        run: npm ci

      - name:
          Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # Both Playwright projects start their own web server (app on :3000,
      # Storybook on :6006) and mock the API and MSAL, so no backend is needed -
      # but neither provisions a browser binary.
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run app and Storybook BDD suites
        run: npm run test:e2e

      - name: Upload Playwright report, traces, and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-node24-${{ github.run_attempt }}
          path: |
            reports/playwright/**
            reports/test-results/**
          if-no-files-found: error
          retention-days: 14

  # Proves the declared floor itself installs, not merely "some Node 24". That is
  # a property of the dependency tree and the install path, not of the app
  # source, so it is path-gated on dependency and workflow files (via
  # detect-changes) rather than run on every PR.
  lower-bound-node24:
    name: lower-bound-node24
    needs: detect-changes
    if: needs.detect-changes.outputs.deps == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.0.0'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/lower-bound

      - name: Install on the exact floor with strict peers
        run:
          npm ci --strict-peer-deps 2>&1 | tee
          reports/ci/lower-bound/install.log

      - name:
          Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      - name: Run dependency security policy tests
        run: >-
          npm run test:unit -- tests/unit/config/dependencySecurity.test.ts
          tests/unit/security/dompurify.regression.test.ts
          tests/unit/runtime/trustedtypes.test.ts 2>&1 | tee
          reports/ci/lower-bound/policy.log

      - name: Lint
        run: npm run lint 2>&1 | tee reports/ci/lower-bound/lint.log

      - name: Type-check
        run: npm run type-check 2>&1 | tee reports/ci/lower-bound/type-check.log

      - name: Build app
        run: npm run build 2>&1 | tee reports/ci/lower-bound/build.log

      - name: Upload lower-bound logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lower-bound-node24-${{ github.run_attempt }}
          path: reports/ci/lower-bound/**
          if-no-files-found: error
          retention-days: 14

  # SonarCloud analysis runs in release.yml's `sonarcloud` job (on `push:
  # main`), not here: `pull_request` withholds all secrets, including
  # SONAR_TOKEN, from runs whose head is a fork - which is how GitHub treats
  # this repo's Copilot-coding-agent-opened PRs. `push` events on the base
  # repository always have secrets available, so analysis runs there instead.
