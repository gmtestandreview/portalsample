name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the in-flight run for that PR obsolete. Cancel it
# rather than paying for both sets of jobs - matches chromatic.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

# GitHub's implicit runner shell is `bash -e`, which has no pipefail: a step
# that pipes into `tee` would report the exit code of `tee`, not of the command
# being recorded. Naming bash explicitly restores `-o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  static-quality-node24:
    name: static-quality-node24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/static-quality

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci 2>&1 | tee reports/ci/static-quality/install.log

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      - name: Type-check
        run: npm run type-check 2>&1 | tee reports/ci/static-quality/type-check.log

      - name: Lint
        run: npm run lint 2>&1 | tee reports/ci/static-quality/lint.log

      - name: Lint MDX
        run: npm run lint:mdx 2>&1 | tee reports/ci/static-quality/lint-mdx.log

      # Guards analysis/BUSINESS_RULES.md against citation rot. A 2026-09-02 audit (CRD-044) found
      # 18 of 21 examined citations pointing at the wrong line, three past end of file, because line
      # numbers decay on every edit above them. Fails only on citations that are provably wrong or
      # unreachable; weakly-anchored ones are reported without failing the build.
      - name: Verify business rule citations
        run: npm run lint:rules 2>&1 | tee reports/ci/static-quality/lint-rules.log

      - name: Upload static quality logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: static-quality-node24-${{ github.run_attempt }}
          path: reports/ci/static-quality/**
          if-no-files-found: error
          retention-days: 14

  # Path gate for the agent-tooling job below. A whole-workflow `paths:` filter
  # would gate every job; this narrows just the Python tooling checks, which are
  # disjoint from the React app.
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-tooling: ${{ steps.scope.outputs.agent-tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changes under scripts/, templates/, tests/hooks/
        id: scope
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^(scripts|templates|tests/hooks)/'; then
            echo "agent-tooling=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent-tooling=false" >> "$GITHUB_OUTPUT"
            echo "No changes under scripts/, templates/, or tests/hooks/ - agent-tooling will be skipped."
          fi

  # The agent-orchestration tooling under scripts/, templates/, and tests/hooks/
  # gates real behaviour - a PreToolUse security hook, a background watcher that
  # shells out and writes files, the statusline command - but is disjoint from
  # the React app. It rode along in static-quality-node24 and ran on every PR;
  # it now runs only when one of those trees changes. This workflow has no
  # required status checks, so a skipped run blocks nothing.
  agent-tooling:
    name: agent-tooling
    needs: detect-changes
    if: needs.detect-changes.outputs.agent-tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/agent-tooling

      # compileall is the cheap syntax floor; the two suites below cover behaviour.
      - name: Python tooling syntax
        run: python3 -m compileall -q scripts templates tests/hooks 2>&1 | tee reports/ci/agent-tooling/python-compile.log

      # Exercises scripts/pre_tool_use.py the way Claude Code invokes it - a JSON
      # tool call on stdin, an exit code out - across both what must be blocked
      # and the ordinary commands that must still be allowed. A guard that blocks
      # real work gets switched off, so the false-positive half is load-bearing.
      - name: Hook guard behaviour
        run: python3 tests/hooks/test_pre_tool_use.py 2>&1 | tee reports/ci/agent-tooling/hook-guard.log

      # os.kill(pid, 0) is the POSIX liveness idiom and is destructive on Windows,
      # where it terminates the process it is probing. scripts/watcher.py was
      # fixed; the templates/ copy that ships downstream was not. This keeps the
      # two from drifting apart again.
      - name: Watcher pid handling
        run: python3 tests/hooks/test_watcher_pid.py 2>&1 | tee reports/ci/agent-tooling/watcher-pid.log

      - name: Upload agent-tooling logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agent-tooling-${{ github.run_attempt }}
          path: reports/ci/agent-tooling/**
          if-no-files-found: error
          retention-days: 14

  # Each test environment is its own required status. `fail-fast: false` keeps a
  # failing partition from cancelling the others, so every surface reports.
  vitest:
    name: vitest-${{ matrix.partition.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition:
          - name: unit
            command: npm run test:ci:unit
            report: reports/vitest/unit-junit.xml
            install-browser: false
          - name: storybook
            command: npm run test:ci:storybook
            report: reports/vitest/storybook-junit.xml
            install-browser: true
          - name: quality
            command: npm run test:ci:quality
            report: reports/vitest/quality-junit.xml
            install-browser: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # A fresh runner has no browser binaries; dependency install does not
      # provision them (proved by commit cb5fdaa).
      - name: Install Playwright Chromium
        if: matrix.partition.install-browser
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.partition.name }} tests
        run: ${{ matrix.partition.command }}

      - name: Upload ${{ matrix.partition.name }} JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vitest-${{ matrix.partition.name }}-${{ github.run_attempt }}
          path: ${{ matrix.partition.report }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage
        if: always() && matrix.partition.name == 'unit'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vitest-unit-coverage-${{ github.run_attempt }}
          path: reports/coverage/unit/**
          if-no-files-found: error
          retention-days: 14

  build-node24:
    name: build-node24
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/build

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci 2>&1 | tee reports/ci/build/install.log

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      - name: Build app
        run: npm run build 2>&1 | tee reports/ci/build/app-build.log

      - name: Verify Storybook documentation
        run: npm run storybook:verify:docs 2>&1 | tee reports/ci/build/storybook-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-node24-${{ github.run_attempt }}
          path: reports/ci/build/**
          if-no-files-found: error
          retention-days: 14

  # The focused date suite is timezone-sensitive by construction. Each zone is
  # its own leg so a failure in one stays attributable; `fail-fast: false` keeps
  # the passing zones reporting. The UTC leg carries Child Plan B's characterized
  # DatePicker failures and stays red until B1 lands - that visibility is the
  # point, so this job must never be allowed to mask its own result.
  date-timezone:
    name: date-timezone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        zone:
          - name: UTC
            slug: utc
          - name: Australia/Sydney
            slug: sydney
          - name: America/Los_Angeles
            slug: los-angeles
    env:
      TZ: ${{ matrix.zone.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # dateOnly.ts is where the local-vs-UTC split lives: picker Dates are built
      # at local noon and read back with local getters, API Dates at UTC midnight
      # and read back with UTC getters. dateOnly.test.ts pins that split and must
      # run in every zone, so it is named explicitly below alongside the pickers.
      - name: Run focused date suite in ${{ matrix.zone.name }}
        run: >-
          npm run test:unit --
          tests/unit/components/inputs/datePickerWrapper.test.tsx
          tests/unit/routes/requestForQuote/props.test.ts
          tests/unit/routes/requestForQuote/validation.test.ts
          tests/unit/utils/dateOnly.test.ts
          --reporter=default --reporter=junit
          --outputFile.junit=reports/vitest/date-${{ matrix.zone.slug }}-junit.xml

      - name: Upload ${{ matrix.zone.name }} JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: date-${{ matrix.zone.slug }}-${{ github.run_attempt }}
          path: reports/vitest/date-${{ matrix.zone.slug }}-junit.xml
          if-no-files-found: error
          retention-days: 14

  e2e-node24:
    name: e2e-node24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # Both Playwright projects start their own web server (app on :3000,
      # Storybook on :6006) and mock the API and MSAL, so no backend is needed -
      # but neither provisions a browser binary.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run app and Storybook BDD suites
        run: npm run test:e2e

      - name: Upload Playwright report, traces, and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-node24-${{ github.run_attempt }}
          path: |
            reports/playwright/**
            reports/test-results/**
          if-no-files-found: error
          retention-days: 14

  # Proves the declared floor itself installs, not merely "some Node 24".
  lower-bound-node24:
    name: lower-bound-node24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.0.0'
          cache: 'npm'

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/lower-bound

      - name: Install on the exact floor with strict peers
        run: npx --yes npm@11.17.0 ci --strict-peer-deps 2>&1 | tee reports/ci/lower-bound/install.log

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      - name: Run dependency security policy tests
        run: >-
          npm run test:unit --
          tests/unit/config/dependencySecurity.test.ts
          tests/unit/security/dompurify.regression.test.ts
          tests/unit/runtime/trustedtypes.test.ts
          2>&1 | tee reports/ci/lower-bound/policy.log

      - name: Lint
        run: npm run lint 2>&1 | tee reports/ci/lower-bound/lint.log

      - name: Type-check
        run: npm run type-check 2>&1 | tee reports/ci/lower-bound/type-check.log

      - name: Build app
        run: npm run build 2>&1 | tee reports/ci/lower-bound/build.log

      - name: Upload lower-bound logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lower-bound-node24-${{ github.run_attempt }}
          path: reports/ci/lower-bound/**
          if-no-files-found: error
          retention-days: 14

  # SonarCloud analysis. Its own job so a scanner or gate failure is
  # attributable on its own status rather than folded into a test partition.
  #
  # Depends on `vitest` because it consumes that job's unit coverage artifact.
  # Each test environment runs exactly once through the matrix, so re-running
  # the unit suite here would both duplicate minutes per PR and risk reporting
  # a different result than the partition that owns that status.
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: vitest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud derives new code from SCM blame dates. The default
          # shallow clone gives it no history to read, which silently breaks
          # new-code attribution and every gate condition resting on it.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/sonarcloud

      # The analyzer resolves TypeScript types against installed dependencies;
      # without them type inference degrades and findings change.
      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci 2>&1 | tee reports/ci/sonarcloud/install.log

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # Must precede the scan: sonar.javascript.lcov.reportPaths points at
      # reports/coverage/unit/lcov.info, and a missing report is imported as
      # zero coverage rather than raising an error.
      # Matched by pattern, not by an exact `run_attempt` name. Re-running only the failed jobs
      # bumps `github.run_attempt` here while leaving the vitest job untouched, because it already
      # passed - so the exact name this used to build could never exist on a re-run, and the job
      # died on "Artifact not found for name: vitest-unit-coverage-2". The suffix has to stay on
      # the upload side, where it keeps a second attempt from colliding with the first attempt's
      # artifact, so the tolerance belongs here. Coverage for a given commit is the same whichever
      # attempt produced it, which is what makes merging the matches safe.
      - name: Restore unit coverage from the vitest partition
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: vitest-unit-coverage-*
          merge-multiple: true
          path: reports/coverage/unit

      # The official action, not `npx --yes @sonar/scan`. npx resolves and installs the package at
      # CI time and runs its lifecycle scripts, and it does so in a step that holds SONAR_TOKEN -
      # an install-time code execution path this job never needed. The action instead downloads a
      # prebuilt Scanner CLI and verifies its GPG signature (skipSignatureVerification defaults to
      # false), so nothing from npm executes during scanner setup.
      #
      # Pinned by commit SHA, which is refs/tags/v8.1.0. scannerVersion is deliberately left at the
      # action's own default (8.1.0.6389) so the CLI moves only when this SHA moves - the same
      # reason npm is pinned above, an unpinned scanner can shift analysis results between runs
      # with no commit to explain it.
      #
      # sonar.qualitygate.wait makes a red gate fail this job, which is what turns the gate into a
      # merge block.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      # Replaces the log the old `| tee` produced. report-task.txt is the scanner's own record of
      # the analysis and carries the task and dashboard URLs, which is the traceability the
      # evidence bundle exists for; the raw console output remains in the job log either way.
      - name: Capture scanner report task
        if: always()
        run: |
          if [ -f .scannerwork/report-task.txt ]; then
            cp .scannerwork/report-task.txt reports/ci/sonarcloud/
          else
            echo "No .scannerwork/report-task.txt: the scan did not reach the point of submitting an analysis." \
              > reports/ci/sonarcloud/scan-note.txt
          fi

      - name: Upload SonarCloud evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sonarcloud-${{ github.run_attempt }}
          path: reports/ci/sonarcloud/**
          if-no-files-found: error
          retention-days: 14
