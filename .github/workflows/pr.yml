name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_ENVIRONMENT: local
      VITE_ENTRA_CLIENT_ID: 12345678-1234-4321-a432-123456789abc
      VITE_ENTRA_TENANT_ID: 87654321-4321-4321-b432-cba987654321
      VITE_API_BASE_URL: http://localhost:5085
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" && exit 0
          echo "Native binding missing after npm ci; npm's own satisfaction check won't detect this, so force-reinstall the specific package."
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].optionalDependencies['@rolldown/binding-linux-x64-gnu']")
          npx --yes npm@11.17.0 install --no-save --force "@rolldown/binding-linux-x64-gnu@$VERSION"
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Install Playwright Chromium (required by Storybook Browser Mode tests)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck, Vitest, coverage, and quality regression
        run: npm run test:ci

      - name: Build app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  dependency-security-node20:
    name: Dependency security (Node 20.19.0 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" && exit 0
          echo "Native binding missing after npm ci; npm's own satisfaction check won't detect this, so force-reinstall the specific package."
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].optionalDependencies['@rolldown/binding-linux-x64-gnu']")
          npx --yes npm@11.17.0 install --no-save --force "@rolldown/binding-linux-x64-gnu@$VERSION"
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Run lower-bound dependency security tests
        run: >-
          npm run test:unit --
          tests/unit/config/dependencySecurity.test.ts
          tests/unit/security/dompurify.regression.test.ts
          tests/unit/runtime/trustedtypes.test.ts
