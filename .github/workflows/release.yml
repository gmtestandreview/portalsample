name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_APP_ENVIRONMENT: production
      VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID || '12345678-1234-4321-a432-123456789abc' }}
      VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID || '87654321-4321-4321-b432-cba987654321' }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:5085' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with declared npm
        run: npx --yes npm@11.17.0 ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" || npx --yes npm@11.17.0 install --no-save

      - name: Lint
        run: npm run lint

      - name: Typecheck, Vitest, coverage, and quality regression
        run: npm run test:ci

      - name: Build app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
