name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # See pr.yml: npm is provisioned via `corepack enable`, and corepack must not
  # block on its download prompt in CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_APP_ENVIRONMENT: production
      VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID || '12345678-1234-4321-a432-123456789abc' }}
      VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID || '87654321-4321-4321-b432-cba987654321' }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:5085' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud derives new code from SCM blame dates. The default
          # shallow clone gives it no history to read, which silently breaks
          # new-code attribution and every gate condition resting on it.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Install dependencies with declared npm
        run: npm ci

      - name: Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      - name: Install Playwright Chromium (required by Storybook Browser Mode tests)
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Lint MDX
        run: npm run lint:mdx

      # The same partitioned commands the PR workflow runs, so a release cannot
      # pass through a coarser gate than the pull request that produced it.
      - name: Vitest unit partition
        run: npm run test:ci:unit

      # Consumed by the sonarcloud job below. Uploaded here rather than
      # re-running the unit suite there - same reason pr.yml's test partitions
      # each run exactly once: duplicating minutes and risking a different
      # result than the run that owns this status.
      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unit-coverage
          path: reports/coverage/unit
          if-no-files-found: error
          retention-days: 1

      - name: Vitest Storybook partition
        run: npm run test:ci:storybook

      - name: Vitest quality partition
        run: npm run test:ci:quality

      - name: Run app and Storybook BDD suites
        run: npm run test:e2e

      - name: Build app
        run: npm run build

      - name: Verify Storybook documentation
        run: npm run storybook:verify:docs

  # Its own job so a scanner or gate failure is attributable on its own
  # status rather than folded into quality-gate. Runs on `push: main`, a
  # trusted context where secrets are always available - unlike
  # `pull_request`, which withholds them from fork-originated runs (this
  # repo's PRs, opened by GitHub Copilot's coding agent, are treated as
  # fork-originated). See sonar-project.properties for scan config.
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Activate the packageManager-pinned npm
        run: corepack enable

      - name: Prepare evidence directory
        run: mkdir -p reports/ci/sonarcloud

      # The analyzer resolves TypeScript types against installed dependencies;
      # without them type inference degrades and findings change.
      - name: Install dependencies with declared npm
        run: npm ci 2>&1 | tee reports/ci/sonarcloud/install.log

      - name:
          Verify optional native bindings installed (npm/cli#4828 workaround)
        uses: ./.github/actions/verify-rolldown-binding

      # Must precede the scan: sonar.javascript.lcov.reportPaths points at
      # reports/coverage/unit/lcov.info, and a missing report is imported as
      # zero coverage rather than raising an error.
      - name: Restore unit coverage from quality-gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unit-coverage
          path: reports/coverage/unit

      # The official action, not `npx --yes @sonar/scan`. npx resolves and installs the package at
      # CI time and runs its lifecycle scripts, and it does so in a step that holds SONAR_TOKEN -
      # an install-time code execution path this job never needed. The action instead downloads a
      # prebuilt Scanner CLI and verifies its GPG signature (skipSignatureVerification defaults to
      # false), so nothing from npm executes during scanner setup.
      #
      # Pinned by commit SHA, which is refs/tags/v8.2.1. scannerVersion is deliberately left at the
      # action's own default so the CLI moves only when this SHA moves - the same reason npm is
      # pinned above, an unpinned scanner can shift analysis results between runs with no commit
      # to explain it.
      #
      # sonar.qualitygate.wait makes a red gate fail this job.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Capture scanner report task
        if: always()
        run: |
          if [ -f .scannerwork/report-task.txt ]; then
            cp .scannerwork/report-task.txt reports/ci/sonarcloud/
          else
            echo "No .scannerwork/report-task.txt: the scan did not reach the point of submitting an analysis." \
              > reports/ci/sonarcloud/scan-note.txt
          fi

      - name: Upload SonarCloud evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonarcloud-${{ github.run_attempt }}
          path: reports/ci/sonarcloud/**
          if-no-files-found: error
          retention-days: 14
