# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Verify rolldown native binding
description: >-
  Work around npm/cli#4828: npm ci can silently skip rolldown's
  platform-specific optional binding (@rolldown/binding-linux-x64-gnu on Linux,
  @rolldown/binding-win32-x64-msvc on Windows), and npm's own satisfaction check
  does not detect the gap. Force-reinstall the exact version pinned in the
  lockfile when the binding for the current platform is missing. Requires a
  prior actions/checkout, corepack enable, and npm ci in the same job.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        BINDING=$(node -p "({linux:{x64:'@rolldown/binding-linux-x64-gnu'},win32:{x64:'@rolldown/binding-win32-x64-msvc'}})[process.platform]?.[process.arch] ?? ''")
        if [ -z "$BINDING" ]; then
          echo "Unsupported platform $(node -p process.platform)/$(node -p process.arch) for rolldown binding verification" >&2
          exit 1
        fi
        node -e "require.resolve('$BINDING')" && exit 0
        echo "Native binding $BINDING missing after npm ci; npm's own satisfaction check won't detect this, so force-reinstall the specific package."
        VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].optionalDependencies['$BINDING']")
        npm install --no-save --force "$BINDING@$VERSION"
        node -e "require.resolve('$BINDING')"
